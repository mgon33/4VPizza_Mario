<nav class="d-flex justify-content-between align-items-center p-3 mb-4 border-bottom mi-nav-principal">
    <div class="logo-nombre">
        <img src="https://cdn-icons-png.flaticon.com/512/3132/3132693.png" alt="Logo" width="30" height="30" class="me-2">
        <strong> 4V Pizzas - Mario González</strong>
    </div>
    <div class="d-flex gap-4 botones-paginas">
        <a href="" class="text-decoration-none text-dark">Nuestras Pizzas</a>
        <a href="" class="text-decoration-none text-dark">Realizar un pedido</a>
    </div>
    <form class="d-flex buscador">
        <input class="form-control form-control-sm me-2" type="search" placeholder="Buscar por Ingredientes">
        <button class="btn btn-sm btn-outline-dark" type="submit">Buscar</button>
    </form>
</nav>

<div class="container">
    <h2 class="text-center my-4">Tienda de Pizzas Online - 4V Mario</h2>
    <div class="row">
        @for (pizza of pizzas; track $index) {
            <div class="col-12 col-md-6 col-lg-3 mb-4">
                <div class="pizzas">
                    <div class="cabecera-pizza">
                        <h5 class="m-0">{{ pizza.nombre }} <strong>{{ pizza.precio }}€</strong></h5>
                    </div>
                    <img [src]="pizza.imagen" class="card-img-top" [alt]="pizza.nombre" style="height: 200px; object-fit: cover;">
                    <div class="info-pizza">
                        <h6>Ingredientes: </h6>
                        <ul>
                            @for (ingrediente of pizza.ingredientes; track $index) {
                                <li>{{ingrediente}}</li>
                            }
                        </ul>
                    </div>
                </div>
            </div>
        }
    </div>
</div>
