<h3>Tu Pedido: </h3>
<table class="table ">
   <thead>
        <tr>
            <th>Pizza</th>
            <th>Cantidad</th>
            <th>Precio</th>
        </tr>
    </thead>
    <tbody>
        @for (linea of lineas(); track $index) {
            <tr>
                <td>{{linea.pizza.nombre}}</td>
                <td>{{linea.cantidad}}</td>
                <td>{{linea.pizza.precio * linea.cantidad}}€</td>
            </tr>
        } @empty {
            <tr>
                <td colspan="3">El pedido está vacío.</td>
            </tr>
        }
    </tbody>
</table>
<h5>Total: {{total}}€</h5>
