<div class="form mt-5">
    <h3>Realiza tu Pedido!</h3>
    <form>
        <label for="direccion"><h6>Dirección de envío:</h6></label><br>
        <input type="text" id="direccion" name="direccion"><br><br>

        <label for="hora"><h6>Hora de entrega:</h6></label><br>
        <input type="time" id="hora" name="campo-hora"><br><br>

        <input type="radio" name="pagos" id="bizum" (change)="metodoPago = 'bizum'">
        <label for="bizum"><h6>Bizum</h6></label><br>

        <input type="radio" name="pagos" id="tarjeta" (change)="metodoPago = 'tarjeta'">
        <label for="tarjeta"><h6>Tarjeta Bancaria</h6></label><br>

        @if (metodoPago === 'tarjeta') {
            <div class="mb-3">
                <label for="numTarjeta">Número de tarjeta:</label><br>
                <input type="text" name="numTarjeta" id="numTarjeta">
            </div>
        }

        @if (metodoPago === 'bizum') {
            <div class="mb-3">
                <label for="numTelefono">Número de teléfono:</label><br>
                <input type="tel" name="numTelefono" id="numTelefono">
            </div>
        }
    </form>
</div>
